name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消上一次仍在跑的构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: test / lint / assembleDebug
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # material3/material-color-utilities 是 submodule，缺它无法配置构建
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 37 / NDK 29 / cmake 3.22.1 由 AGP 按需下载，需要先接受许可
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # debug 构建不需要 local.properties 里的 release 签名；keystore/debug.keystore 未入库时
      # AGP 会自动生成默认 debug keystore，足够产出可安装的 debug APK

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        # 首次接入时 lint 基线尚未清理，先只报告不阻断；清理完成后去掉 continue-on-error 即可转为必过
        continue-on-error: true
        run: ./gradlew lint --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
