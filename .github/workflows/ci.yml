name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# 同一分支的新推送取消上一次仍在跑的构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: test / lint / debug / release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # material3/material-color-utilities 是 submodule，缺它无法配置构建
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk 37 / NDK 29 / cmake 3.22.1 由 AGP 按需下载，需要先接受许可
      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # 缺少本地 release 签名时构建 unsigned release，不向 PR 提供发布密钥。

      - name: Unit tests
        run: ./gradlew test --stacktrace

      - name: Lint
        run: ./gradlew lint --stacktrace

      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify release
        run: ./gradlew :app:lintRelease :app:assembleRelease --stacktrace

      - name: Validate release APK resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile

          properties = Path("gradle.properties").read_text().splitlines()
          assert "android.enableResourceOptimizations=false" in properties
          apks = list(Path("app/build/outputs/apk/release").glob("*.apk"))
          assert apks, "Release APK is missing"
          for apk in apks:
              with ZipFile(apk) as archive:
                  entries = archive.namelist()
                  assert "AndroidManifest.xml" in entries, "Release APK manifest is missing"
                  assert "resources.arsc" in entries, "Release APK resource table is missing"
                  assert any(entry.startswith("res/") for entry in entries), "Release APK resources are missing"
          PY

      - name: Upload debug APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
